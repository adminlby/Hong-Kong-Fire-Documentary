" cx="42.10526315789474" cy="42.10526315789474" r="20" stroke-width="2.105263157894737" stroke-dasharray="125.664" stroke-dashoffset="125.66370614359172px" class="v-progress-circular__overlay"></circle></svg><div class="v-progress-circular__info"></div></div></div><div class="app__layout" style="display: none;"></div></div></div><noscript><iframe src="//nextbuzz.cloud/containers/12b1eda0-2b7d-4f32-a130-2131f1114d0e/noscript.html" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><script src="/static/js/chunk-vendors.3ea781a0.js" type="module"></script><script src="/static/js/app.b464aa90.js" type="module"></script><script src="/static/js/chunk-vendors-legacy.3a68f1a7.js" nomodule=""></script><script src="/static/js/app-legacy.f22ad528.js" nomodule=""></script><script>        function domReady(fn) {                        document.addEventListener('DOMContentLoaded', fn);                if (document.readyState === 'interactive' || document.readyState === 'complete' ) {                fn();            }        }            domReady(function(){VueApp.main({"article":{"template_id":3,"share_url":"https://share.881903.com?article_id=2614935&article_column_id=11&fallbackurl=/news/local/2614935","share_image":"https://stream.881903.com/public/bc19aa6fa2d662dc359e55757e636d0a/2026/01/4746628a10f90acbc12cacaafe8c94af.jpg","content_type":304,"content_id":2671574,"article_id":2614935,"title":"陳國基：將優化招標妥防圍標　會向市建局提供資源","subheading":"","highlight":1,"hashtags":[],"create_datetime":"2026-01-17 08:32:03","schedule_ts":"2026-01-17 08:31:00","last_update_datetime":"2026-01-17 11:30:00","content":"<p>政務司長陳國基表示，宏福苑大火後針對圍標問題的調查發現，業主在大維修需聘請顧問公司，負責提出維修建議及招標，但有害群之馬的顧問公司刻意容許以不尋常的低價中標，並聘請有勾結的承辦商；亦有個別人士在業主立案法團審議大維修提議時，收集大量授權票，業主在通過後才如夢初醒，但在法律上已難以推翻決定。</p>\n\n<p>陳國基在本台節目指，當局日後會優化市建局「招標妥」，將制定顧問公司及承建商的名單，期間加入警方及廉署意見，確保名單上公司表現都是合格。他指，市建局知道公司的表現是否合格，要協助法團評估及招標；完成維修後會向業主進行問卷調查，如有投訴屬實，會檢視公司是否適合繼續列入預選名單。他指，市建局日後的責任會增加，政府會提供所需資源。</p>\n\n<p>陳國基又指，會將大維修由以往的「二級小型工程」提升至「一級」，需另聘第三方人士審查。對於有意見擔心會加重成本，他認為，相關費用只佔大維修工程的小部分，如能避免出現圍標，業主節省的費用會更多。陳國基又指，明白涉及圍標的問題有如癌細胞一樣會持續變化，政府會密切留意。</p>\n\n<p><strong>研提高出席法團人數比例　加強規管「授權票」</strong></p>\n\n<p>陳國基指，當局亦正研究如涉及高價維修費，需提高業主出席法團的人數比例；並加強規管「授權票」，需認證簽署業主身份及限制每人持票數目，希望鼓勵業主多關心大廈事務。</p>\n\n<p>他又指，會在法例上引入物管公司在大廈消防措施的法定責任，指在過往法例下，只有法團需負刑責，修例後會要求物管公司定期檢查防火設施，如有損壞要立即維修，同時研究引入定額罰款，加快檢控程序。</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":999436,"media_type":3,"title":"","path":"/2026/01/999436/src/62ce0183-48aa-4625-8b46-dda3864d1a6a_1768610033.jpg","filename":"260117_(左至右) 張秀雲、陳國基、陳淑薇.jpg","article_media_rlt_id":486071,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"陳國基（中）出席本台節目","resource":[{"resource_id":3219447,"path":"https://stream.881903.com/public/bc19aa6fa2d662dc359e55757e636d0a/2026/01/4746628a10f90acbc12cacaafe8c94af.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"bc19aa6fa2d662dc359e55757e636d0a","is_source":0,"media_id":999436}],"src":"https://stream.881903.com/public/bc19aa6fa2d662dc359e55757e636d0a/2026/01/4746628a10f90acbc12cacaafe8c94af.jpg","srcset":"https://stream.881903.com/public/bc19aa6fa2d662dc359e55757e636d0a/2026/01/4746628a10f90acbc12cacaafe8c94af.jpg 3x"}],"article_contents":[{"article_content_rlt_id":139725,"article_content_id":139725,"display_order":1,"article_content_type":7,"article_media_rlt_id":486071,"content":null,"media_id":999436,"media_type":3,"title":"","path":"/2026/01/999436/src/62ce0183-48aa-4625-8b46-dda3864d1a6a_1768610033.jpg","filename":"260117_(左至右) 張秀雲、陳國基、陳淑薇.jpg","display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"sh
