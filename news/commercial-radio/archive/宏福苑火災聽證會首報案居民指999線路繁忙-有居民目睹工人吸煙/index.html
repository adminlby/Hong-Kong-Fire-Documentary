2.10526315789474 42.10526315789474" style="transform: rotate(0deg);"><circle fill="transparent" cx="42.10526315789474" cy="42.10526315789474" r="20" stroke-width="2.105263157894737" stroke-dasharray="125.664" stroke-dashoffset="125.66370614359172px" class="v-progress-circular__overlay"></circle></svg><div class="v-progress-circular__info"></div></div></div><div class="app__layout" style="display: none;"></div></div></div><noscript><iframe src="//nextbuzz.cloud/containers/12b1eda0-2b7d-4f32-a130-2131f1114d0e/noscript.html" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><script src="/static/js/chunk-vendors.56a229bf.js" type="module"></script><script src="/static/js/app.4ea975f1.js" type="module"></script><script src="/static/js/chunk-vendors-legacy.c5e82862.js" nomodule=""></script><script src="/static/js/app-legacy.0024db6f.js" nomodule=""></script><script>        function domReady(fn) {                        document.addEventListener('DOMContentLoaded', fn);                if (document.readyState === 'interactive' || document.readyState === 'complete' ) {                fn();            }        }            domReady(function(){VueApp.main({"article":{"template_id":3,"share_url":"https://share.881903.com?article_id=2624741&article_column_id=11&fallbackurl=/news/local/2624741","share_image":"https://stream.881903.com/public/3a446467197a727ddd8475501dd4f24b/2026/03/3dd18dd7ef810125f129a18018ec6abf.jpg","content_type":304,"content_id":2698183,"article_id":2624741,"title":"宏福苑火災聽證會｜首報案居民指999線路繁忙  有居民目睹工人吸煙","subheading":"","highlight":1,"hashtags":[],"create_datetime":"2026-03-26 09:54:02","schedule_ts":"2026-03-26 09:53:00","last_update_datetime":"2026-03-26 18:57:00","content":"<p>大埔宏福苑火災獨立委員會，早上在中環展城館舉行首輪第4場聽證會，傳召11名證人作供，包括9名宏福苑居民。</p>\n\n<p>首先作供的宏昌閣居民吳靄詩指，宏福苑進行大維修時，每層外牆都築起棚架，供工人作行走通道，棚架上有很多垃圾，會聽到相信是石屎碎片、建築材料掉下的聲音。她又指，日間工程進行時，雖然看不見有工人吸煙，但在家中窗戶和大門都聞到煙味。</p>\n\n<p>她又指，宏昌閣的防煙門沒有上鎖，可以打開，不過地下大堂外的防煙門曾經試過無法打開。</p>\n <p><strong>首報案居民指　999線路繁忙</strong></p>\n\n<p>宏昌閣首名報案居民王嘉婉作供指，大火當日，事發時她在家中，到下午2時50分，聽到工人說發生火警，她開窗聞到有煙味，隨即關窗逃生，並致電999熱線報案，不過熱線「線路繁忙」，等了很長時間才有人接聽，指「沒有想過999會線路繁忙」。<br />\n&nbsp;<br />\n她之後沿後樓梯行落大廈大堂，走到某一層時，見到窗外變成紅色，到2時55分到達公園致電家人，再前往廣福邨親人家中。她指，當時從廣福邨廣祐樓望過去宏昌閣，火勢已燒至頂樓，消防員開始灌救，但只往一樓射水、未能射往二樓，火勢最終飄到其他大廈。</p>\n\n<p><strong>有居民兩度目睹工人吸煙</strong></p>\n\n<p>宏昌閣6樓居民陳全作供指，大維修期間有兩次目睹工人吸煙，其中一次是以剷車運物料時，另一次是工人於大廈地下工作時，質疑承建商監管有很大問題。</p>\n\n<p>他憶述火警當日下午約2時許聞到燒焦味。他先後致電通知管理處和報警，期間又發現廚房位置有濃煙，有煙滲入家中，亦聽到窗外有人說無法撲熄火勢，要盡快逃生。他表示當日最令人深刻是逃生時屋苑安靜，沒有人呼叫要走火警，亦沒聽到管理處用擴音器呼籲逃生或火警鐘，期望針對火警系統再作檢討。&nbsp;</p>\n\n<p><strong>八旬婆婆於火警當晚9時獲救</strong></p>\n\n<p>居於宏泰閣14樓、85歲居民冼善卿在女兒陪同下作供。她憶述，當日下午約1至2時打算外出，但開門發現走廊有黑煙，懷疑發生火警，便回家以濕毛巾堵住門罅，並開抽氣扇及風扇試圖抽走濃煙，以及向竹棚及棚網噴水。她指單位棚網在颱風後未有損毀，因此沒有更換，火警時亦未有劇烈焚燒，相信單位外的棚網是「正規」。</p>\n\n<p>她於火警當晚約9時才獲救，指等候救援期間曾經致電管理處，惟無人接聽，之後有消防員到場，協助她戴上面罩，帶她從後樓梯離開。她指，離開期間消防員又抬走一具在樓梯間的遺體，讚揚消防員專業，避免遺體被火災再度蹂躪。<br />\n&nbsp;</p>\n <p><strong>宏泰居民曾自行滅火　晚上由消防員救出稱仿見「天使」</strong></p>\n\n<p>宏泰1006室的居民張次濂午休後作供表示，事發時他在單位內睡午覺，下午3時7分獲朋友訊息通知屋苑發生火災，打開對着宏昌及宏盛閣的窗外，發現大廈對開垃圾站起火，其後有火舌飄到單位，將火勢蔓延至窗外棚網。他表示，其後爬出窗外扶着棚架淋水成功撲熄，但發現兩旁單位外的棚網均起火，亦有火舌跌在頭上，並隨即與太太離開。<br />\n&nbsp;<br />\n兩夫婦離家後拍門通知73歲鄰居離開，但走火樓梯已佈滿濃煙，三人唯有返回張次濂的單位，約20分鐘後單位停電及停水，濃煙從廚房攻入，三人分別到廁所及睡房暫避，指傍晚約6時半已感到絕望，之後聽到有人撞門，形容看見消防員恍如看見頭頂光環的「天使」，其後發覺是消防員頭上照明的燈光。三人其後由消防員逐一救出。<br />\n&nbsp;<br />\n<strong>曾向法團反映火災隱患<br />\n&nbsp;</strong><br />\n張次濂指曾向法團表明一次過圍封8座大廈，或「火燒連環船」，提出分批進行，相信新法團有向政府反映，至於「生口」及發泡膠封窗問題，均有向法團及宏業提及不安全。他又憶述，曾與在10及11樓之間見到「生口」，並擺放有水的可樂樽，亦有許多煙頭，亦曾向宏業反映棚架上有煙盒，對方稱會跟進，又指煙盒可能由上層單位住戶扔落。<br />\n&nbsp;<br />\n他希望作供能將事實反映，期望政府承擔責任，又指多次投訴，但多個部門都指「唔關事」，居民深感無奈，有家庭家破人亡，代價相當大，又呼籲倖存居民努力振作。</p>\n\n<p><strong>遺屬相信委員會將徹查到底</strong></p>\n\n<p>遺屬羅曉琪，住在宏昌閣808室的媽媽在大火中離世。她作供時憶述當日得悉火災後致電媽媽，媽媽稱打開大門後很大煙，周圍都有火光及煙，說「今次死喇」，通話數分鐘後已掛線，並失去聯絡，而兩人通話期間，她未曾聽到火警鐘響。<br />\n&nbsp;<br />\n羅曉琪相信委員會將徹查到底，找出事故責任誰屬，填補法例漏洞，又關注政府部門及承辦商亦需承擔責任。委員會主席陸啟康回應表示會盡能力調查，着她放心。</p>\n\n<p><strong>多1名居民加入涉事方</strong></p>\n\n<p>其餘證人包括外牆清潔工人，其中一人來自負責宏建閣、宏泰閣及宏昌閣外牆粉飾工程的「海德營造工程有限公司」，公司曾於2024年向供應商訂購非阻燃發泡膠板。</p>\n\n<p>另外，再多一名居民葉信賢申請加入成為涉事方，獲委員會批准，令涉事方名單的居民增至8人。</p>\n\n<p>&nbsp;</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":1012680,"media_type":3,"title":null,"path":"/2026/03/1012680/src/70397772-17dd-45f2-887d-5877386ca30a_1774332593.jpg","filename":"623262155_1296516295829717_2023540838498407006_n.jpg","article_media_rlt_id":494703,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":2,"shoot_by":null,"source":"展城館Facebook","thumbnail_media_type":null,"caption":"","resource":[{"resource_id":3252820,"path":"https://stream.881903.com/public/3a446467197a727ddd8475501dd4f24b/2026/03/3dd18dd7ef810125f129a18018ec6abf.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"3a446467197a727ddd8475501dd4f24b","is_source":0,"media_id":1012680}],"src":"https://stream.881903.com/public/3a446467197a727ddd8475501dd4f24b/2026/03/3dd18dd7ef810125f129a18018ec6abf.jpg","srcset":"https://stream.881903.com/public/3a446467197a727ddd8475501dd4f24b/2026/03/3dd18dd7ef810125f129a18018ec6abf.jpg 3x"}],"article_contents":[{"article_content_rlt_id":158915,"article_content_id":158915,"display_order":1,"article_content_type":7,"article_media_rlt_id":494703,"content":null,"media_id":1012680,"media_type":3,"title":null,"path":"/2026/03/1012680/src/70397772-17dd-45f2-887d-5877386ca30a_1774332593.jpg","filename":"623262155_1296516295829717_2023540838498407006_n.jpg","display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":2,"shoot_by":null,"source":"展城館Facebook","thumbnail_media_type":null,"caption":"","resource":[{"resource_id":3252820,"path":"https://stream.881903.com/public/3a446467197a727ddd8475501dd4f24b/2026/03/3dd18dd7ef810125f129a18018ec6abf.jpg","default_encode_profile_ 示，事發時他在單位內睡午覺，下午3時7分獲朋友訊息通知屋苑發生火災，打開對着宏昌及宏盛閣的窗外，發現大廈對開垃圾站起火，其後有火舌飄到單位，將火勢蔓延至窗外棚網。他表示，其後爬出窗外扶着棚架淋水成功撲熄，但發現兩旁單位外的棚網均起火，亦有火舌跌在頭上，並隨即與太太離開。<br />\n&nbsp;<br />\n兩夫婦離家後拍門通知73歲鄰居離開，但走火樓梯已佈滿濃煙，三人唯有返回張次濂的單位，約20分鐘後單位停電及停水，濃煙從廚房攻入，三人分別到廁所及睡房暫避，指傍晚約6時半已感到絕望，之後聽到有人撞門，形容看見消防員恍如看見頭頂光環的「天使」，其後發覺是消防員頭上照明的燈光。三人其後由消防員逐一救出。<br />\n&nbsp;<br />\n<strong>曾向法團反映火災隱患<br />\n&nbsp;</strong><br />\n張次濂指曾向法團表明一次過圍封8座大廈，或「火燒連環船」，提出分批進行，相信新法團有向政府反映，至於「生口」及發泡膠封窗問題，均有向法團及宏業提及不安全。他又憶述，曾與在10及11樓之間見到「生口」，並擺放有水的可樂樽，亦有許多煙頭，亦曾向宏業反映棚架上有煙盒，對方稱會跟進，又指煙盒可能由上層單位住戶扔落。<br />\n&nbsp;<br />\n他希望作供能將事實反映，期望政府承擔責任，又指多次投訴，但多個部門都指「唔關事」，居民深感無奈，有家庭家破人亡，代價相當大，又呼籲倖存居民努力振作。</p>\n\n<p><strong>遺屬相信委員會將徹查到底</strong></p>\n\n<p>遺屬羅曉琪，住在宏昌閣808室的媽媽在大火中離世。她作供時憶述當日得悉火災後致電媽媽，媽媽稱打開大門後很大煙，周圍都有火光及煙，說「今次死喇」，通話數分鐘後已掛線，並失去聯絡，而兩人通話期間，她未曾聽到火警鐘響。<br />\n&nbsp;<br />\n羅曉琪相信委員會將徹查到底，找出事故責任誰屬，填補法例漏洞，又關注政府部門及承辦商亦需承擔責任。委員會主席陸啟康回應表示會盡能力調查，着她放心。</p>\n\n<p><strong>多1名居民加入涉事方</strong></p>\n\n<p>其餘證人包括外牆清潔工人，其中一人來自負責宏建閣、宏泰閣及宏昌閣外牆粉飾工程的「海德營造工程有限公司」，公司曾於2024年向供應商訂購非阻燃發泡膠板。</p>\n\n<p>另外，再多一名居民葉信賢申請加入成為涉事方，獲委員會批准，令涉事方名單的居民增至8人。</p>\n\n<p>&nbsp;</p>\n"}],"author":[],"slugs":["本地","宏福苑火災聽證會｜首報案居民指999線路繁忙-有居民目睹工人吸煙"],"mod_ts":"2026-03-26 18:58:24","jsonLdTag":["本地","展城館"]},"more_news":{"content":[{"content_id":2698772,"content_type":304,"item_id":2624998,"title":"男子闖路軌受傷情況危殆　東鐵綫受阻逾兩小時","program_archive_id":null,"program_id":null,"program_name":null,"program_level":null,"program_class":null,"parent_program":null,"article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":0,"program_host_id":0,"host_name":null,"host_image":null,"uri_code":"local"},"parent_article_column":null,"display_ts":1774629420,"display_date":"2026-03-28","display_start_time":"","display_end_time":"","duration":"0","section_no":null,"preview_content":"東鐵綫服務受阻兩個多小時，在晚上7時陸續恢復正常；一名35歲男子下午4時許在闖入東鐵綫路軌範圍，令到東鐵綫來往旺角東至大圍站暫停服務，港鐵安排免費接駁巴士行駛九龍塘至大圍站。大批乘客在大圍站及九塘站，輪候接駁巴士。\n\n救援人員進入路軌搜尋，在晚上6時許發現這名男子。他懷疑觸電，全身燒傷。其後由救護員用擔架車抬離路軌範圍，由救護車送院， 當時要戴上呼吸面罩。他目前在威爾斯親王醫院救治，情況危殆。\n ...","
