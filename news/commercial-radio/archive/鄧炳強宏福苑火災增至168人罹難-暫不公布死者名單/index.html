練大廈住客加強防火意識　自行巡查有否違規</strong></p>\n\n<p>鄧炳強表示，當局已引入多項防火新措施，包括新科技和策略，強調大廈管理公司和業主都可以幫忙。他舉例說，消防處加強派員巡查大廈消防隱患，甚至派出便裝人員巡查，但總不能「每日站著」，引述有報道指，部分防煙門在巡查後又再出現違規問題。</p>\n\n<p>鄧炳強說，當局未來計劃訓練大廈住客，加強他們的防火意識和基本防火措施，讓他們自行在大廈內巡查，一旦發現有問題，可即時通知管理公司或相關人士，亦可向消防處申報，以便處方採取更有效率的執法行動。他又希望管理公司加強巡邏，以及作出相關紀錄，同時將火警鐘測試，由每年一次加密至每半年一次，以及每年進行防火演習。</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":999109,"media_type":3,"title":null,"path":"/2026/01/999109/src/0c12ee63-ee3f-4f99-87a3-48283dc87c82_1768472699.jpeg","filename":"鄧炳強　謝曉雅攝 15-1.jpeg","article_media_rlt_id":485868,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"鄧炳強指宏福苑火災證實168人遇難　謝曉雅攝","resource":[{"resource_id":3218644,"path":"https://stream.881903.com/public/0bf122c30728322438723d7465f09e1f/2026/01/c9a124c403dd69b844733e2bd2a74525.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"0bf122c30728322438723d7465f09e1f","is_source":0,"media_id":999109}],"src":"https://stream.881903.com/public/0bf122c30728322438723d7465f09e1f/2026/01/c9a124c403dd69b844733e2bd2a74525.jpg","srcset":"https://stream.881903.com/public/0bf122c30728322438723d7465f09e1f/2026/01/c9a124c403dd69b844733e2bd2a74525.jpg 3x"}],"article_contents":[{"article_content_rlt_id":139233,"article_content_id":139233,"display_order":1,"article_content_type":7,"article_media_rlt_id":485868,"content":null,"media_id":999109,"media_type":3,"title":null,"path":"/2026/01/999109/src/0c12ee63-ee3f-4f99-87a3-48283dc87c82_1768472699.jpeg","filename":"鄧炳強　謝曉雅攝 15-1.jpeg","display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thum
