2.10526315789474 42.10526315789474" style="transform: rotate(0deg);"><circle fill="transparent" cx="42.10526315789474" cy="42.10526315789474" r="20" stroke-width="2.105263157894737" stroke-dasharray="125.664" stroke-dashoffset="125.66370614359172px" class="v-progress-circular__overlay"></circle></svg><div class="v-progress-circular__info"></div></div></div><div class="app__layout" style="display: none;"></div></div></div><noscript><iframe src="//nextbuzz.cloud/containers/12b1eda0-2b7d-4f32-a130-2131f1114d0e/noscript.html" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><script src="/static/js/chunk-vendors.56a229bf.js" type="module"></script><script src="/static/js/app.1f2f1ac9.js" type="module"></script><script src="/static/js/chunk-vendors-legacy.c5e82862.js" nomodule=""></script><script src="/static/js/app-legacy.fe17df25.js" nomodule=""></script><script>        function domReady(fn) {                        document.addEventListener('DOMContentLoaded', fn);                if (document.readyState === 'interactive' || document.readyState === 'complete' ) {                fn();            }        }            domReady(function(){VueApp.main({"article":{"template_id":3,"share_url":"https://share.881903.com?article_id=2619769&article_column_id=11&fallbackurl=/news/local/2619769","share_image":"https://stream.881903.com/public/44e1ab897e3230cefd0ba841fd721820/2026/02/648b49abb61340d4ef2f93a5aee229e7.jpg","content_type":304,"content_id":2684553,"article_id":2619769,"title":"甯漢豪專訪｜加強版招標妥更著重資歷和質素　冀中小型承建商列預審名單","subheading":"","highlight":1,"hashtags":["甯漢豪","加強版招標妥"],"create_datetime":"2026-02-19 19:12:19","schedule_ts":"2026-02-20 07:00:00","last_update_datetime":"2026-02-20 07:00:00","content":"<p>發展局局長甯漢豪接受本台訪問，指強化後的招標妥服務，會更著重工程人員的資歷，令有質素的中小型承建商更大機會中標。甯漢豪又指，現時商廈空置率仍然高，加上未來幾年都有商廈落成，政府認為不急於推用作商廈的商業用地。</p>\n\n<p><strong>研增加市建局資金資源</strong></p>\n\n<p>宏福苑五級火後，政府提出強化市建局招標妥服務。發展局局長甯漢豪接受本台訪問，指過去招標妥審視工程顧問或承建商公司，是否列入預審名單時，主要看公司過去進行大型維修的數量和經驗，使一些中小型的公司較難列入名單。甯漢豪指，加強版招標妥將會更著重承建商的人員有否相關資歷和質素，期望有更多不同的顧問公司和承建商參與。</p>\n\n<p>有立法會議員建議成立「樓宇維修局」，處理增加的工作量，當局指角色可能同市建局重疊。甯漢豪表示，會考慮向市建局增加資源，確保有足夠人手，初步考慮循資金上協助。政府正跟市建局討論執行細節，預計下半年落實加強版招標妥。</p>\n <p><strong>政府推地減少　不等於失去主導權</strong></p>\n\n<p>政府過去一個財政年度推出的私營房屋土地，以中小型為主，甯漢豪指，是因為市場仍在回暖初期，需要中小型及集中在成熟社區的土地，令發展商更放膽投資。當市場回暖到較穩定地步，政府會重推新發展區土地，包括東涌新市鎮及北都的私營房屋土地。</p>\n\n<p>有意見擔心，政府推地數量下降，會否將房屋供應主導權讓給市場？甯漢豪指，政府有否主導權不應該看推地的數量，因為私樓土地供應，一向來自不同來源，政府賣地只是其中一個來源，最重要是政府手上擁有足夠儲備土地，當私人市場的供應未達預期，政府有能力出手調教，達到年度推地目標，政府就擁有主導權。</p>\n\n<p><strong>甯漢豪：現時不急於推寫字樓商地</strong></p>\n\n<p>商業用地方面，甯漢豪指政府本年度無推，是建基於市場覺得商廈空置率仍很高。隨著本年度IPO增加、商廈空置率下降，政府會否重推呢？甯漢豪指，事實上本港商廈仍有雙位數的空置率，因此要審視市場情況，加上早年透過賣地發展的商廈項目，將陸續於未來兩三年落成。既然現時有供應，政府的確認為，現在不急於去推辦公大樓商業用地。</p>\n\n<p>甯漢豪又指，政府不是停止造商業用地，或將所有現有的商業用地都改變用途，而是當商業地完成平整時，檢視當時最適合的用途。她又指「究竟政府下個財政年度，有沒有純做辦公大樓的商業用地，大家拭目以待吧。」</p>\n <p><strong>甯漢豪：「若能造福社會　辛苦是值得的」</strong></p>\n\n<p>發展局同時兼顧公共工程、北都發展，宏福苑大火後又要強化市建局角色，推進轉用金屬棚等多項政策，身為局長，工作繁重嗎？「發展局涉獵的政策範圍很廣，但整個團隊抱著一個心，事情雖然多，但是最重要是能落實執行。若能造福社會，大家都覺得有意思的，辛苦都是值得的。」</p>\n\n<p>記者：吳蓁</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":1006078,"media_type":1,"title":"","path":"/2026/02/1006078/src/4283d030-cca6-4569-b8a3-49ab1de0098c_1771502619.mp3","filename":"260219VB (年初四出)甯漢豪 VO TSUN NEW edited by wan.mp3","article_media_rlt_id":490238,"display_item_type":410,"thumbnail_media_id":1006077,"order_idx":1,"source_type":null,"shoot_by":null,"source":null,"thumbnail_media_type":3,"caption":"","thumbnail_resource":[{"resource_id":3236180,"path":"https://stream.881903.com/public/a9a4b7df5a53fe3aed25916427d50ad1/2026/02/2203b90daa62097a917c8fca793ccbc9.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"a9a4b7df5a53fe3aed25916427d50ad1"," content_id":149082,"display_order":5,"article_content_type":1,"article_media_rlt_id":null,"content":"<p><strong>甯漢豪：「若能造福社會　辛苦是值得的」</strong></p>\n\n<p>發展局同時兼顧公共工程、北都發展，宏福苑大火後又要強化市建局角色，推進轉用金屬棚等多項政策，身為局長，工作繁重嗎？「發展局涉獵的政策範圍很廣，但整個團隊抱著一個心，事情雖然多，但是最重要是能落實執行。若能造福社會，大家都覺得有意思的，辛苦都是值得的。」</p>\n\n<p>記者：吳蓁</p>\n"}],"author":[],"slugs":["本地","甯漢豪專訪｜加強版招標妥更著重資歷和質素-冀中小型承建商列預審名單"],"mod_ts":"2026-02-20 07:08:23","jsonLdTag":["本地","甯漢豪","新年訪問","甯漢豪"]},"more_news":{"content":[{"content_id":2685010,"content_type":304,"item_id":2619908,"title":"漁護署鹹田灣一帶採20宗執法 涉亂拋垃圾及非法生火","program_archive_id":null,"program_id":null,"program_name":null,"program_level":null,"program_class":null,"parent_program":null,"article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":0,"program_host_id":0,"host_name":null,"host_image":null,"uri_code":"local"},"parent_article_column":null,"display_ts":1771600680,"display_date":"2026-02-20","display_start_time":"","display_end_time":"","duration":"0","section_no":null,"preview_content":"農曆新年假期間，有露營人士在西貢鹹田灣及西灣非法生火及亂拋垃圾，引起關注。綠色和平推算昨日至今經北潭涌進入西貢郊野公園的人數，達逾1.1萬人，於西灣、鹹田灣、浪茄入夜出現非法露營、隨地棄置垃圾等涉違法環境破壞行為。\n\n漁護署晚上在社交平台表示，截至下午2時，於麥理浩徑第一、二段、鹹田灣、浪茄及西灣營地，一共有20宗執法個案，包括亂拋垃圾及非法生火等；又指過去數日，露營地點的使用情況、衞生及秩序，均...","keyart_url":{"src":"https://stream.881903.com/public/60db7e1701e1573a942c8a67fbf4ed62/2026/02/0fa963ad8013295565c9eb0dd1b607d4.jpg","srcset":"https://stream.881903.com/public/60db7e1701e1573a942c8a67fbf4ed62/2026/02/0fa963ad8013295565c9eb0dd1b607d4.jpg 3x","sizes":null,"width":1200,"height":null},"has_audio":false,"has_video":false,"highlight":0,"premium_content_category":null},{"content_id":2684989,"content_type":304,"item_id":2619892,"title":"何文田爆水管　愛民邨一帶部分樓宇暫停鹹水供應","program_archive_id":null,"program_id":null,"program_name":null,"program_level":null,"program_class":null,"parent_program":null,"article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":0,"program_host_id":0,"host_name":null,"host_image":null,"uri_code":"loc
