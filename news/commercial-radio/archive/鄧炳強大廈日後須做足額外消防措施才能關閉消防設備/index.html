安全，政府會研究將行政措施變成法例，包括規定每半年測試火警鐘及每年一次火警演習；他說業界初步反應正面。<br />\n&nbsp;<br />\n鄧炳強又說，希望以類似「消防大使」的形式，鼓勵大廈住戶留意消防隱患，並通知物管公司及消防處，相信較消防巡邏更有效。他解釋，以往有與居民講解消防知識，但欠缺系統性，希望「消防大使」身份能讓居民負上責任，但他們並沒有權力巡查。有關措施正計劃中，打算在全港各區推行，可能會挑選已有聯絡的大廈率先推行，亦會與地區防火委員會合作。<br />\n&nbsp;</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":999085,"media_type":3,"title":null,"path":"/2026/01/999085/src/63c99b0b-0655-4312-9ebe-25cfff156f90_1768466376.jpg","filename":"全螢幕擷取 1512026 163804.jpg","article_media_rlt_id":485933,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":2,"shoot_by":null,"source":"市建局Youtube","thumbnail_media_type":null,"caption":"","resource":[{"resource_id":3218583,"path":"https://stream.881903.com/public/f966f72e3cbde018f8fe330449afb0a9/2026/01/a8717305e0ab6c99adb341d6df662404.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"f966f72e3cbde018f8fe330449afb0a9","is_source":0,"media_id":999085}],"src":"https://stream.881903.com/public/f966f72e3cbde018f8fe330449afb0a9/2026/01/a8717305e0ab6c99adb341d6df662404.jpg","srcset":"https://stream.881903.com/public/f966f72e3cbde018f8fe330449afb0a9/2026/01/a8717305e0ab6c99adb341d6df662404.jpg 3x"}],"article_contents":[{"article_content_rlt_id":139390,"article_content_id":139390,"display_order":1,"article_content_type":7,"article_media_rlt_id":485933,"content":null,"media_id":999085,"media_type":3,"title":null,"path":"/2026/01/999085/src/63c99b0b-0655-4312-9ebe-25cfff156f90_1768466376.jpg","filename":"全螢幕擷取 1512026 163804.jpg","display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":2,"shoot_by":null,"source":"市建局Youtube","thumbnail_media_type":null,"caption":"","resource":[{"resource_i
