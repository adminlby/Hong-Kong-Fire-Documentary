 caret-color: rgb(112, 112, 112);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="21.05263157894737 21.05263157894737 42.10526315789474 42.10526315789474" style="transform: rotate(0deg);"><circle fill="transparent" cx="42.10526315789474" cy="42.10526315789474" r="20" stroke-width="2.105263157894737" stroke-dasharray="125.664" stroke-dashoffset="125.66370614359172px" class="v-progress-circular__overlay"></circle></svg><div class="v-progress-circular__info"></div></div></div><div class="app__layout" style="display: none;"></div></div></div><noscript><iframe src="//nextbuzz.cloud/containers/12b1eda0-2b7d-4f32-a130-2131f1114d0e/noscript.html" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><script src="/static/js/chunk-vendors.56a229bf.js" type="module"></script><script src="/static/js/app.1f2f1ac9.js" type="module"></script><script src="/static/js/chunk-vendors-legacy.c5e82862.js" nomodule=""></script><script src="/static/js/app-legacy.fe17df25.js" nomodule=""></script><script>        function domReady(fn) {                        document.addEventListener('DOMContentLoaded', fn);                if (document.readyState === 'interactive' || document.readyState === 'complete' ) {                fn();            }        }            domReady(function(){VueApp.main({"article":{"template_id":3,"share_url":"https://share.881903.com?article_id=2619855&article_column_id=11&fallbackurl=/news/local/2619855","share_image":"https://stream.881903.com/public/7af4701a560f3faf5f93622f99e00ab1/2025/12/e9180ec2547beb79a548e54b5554c60f.jpg","content_type":304,"content_id":2684891,"article_id":2619855,"title":"宏福苑長遠安置方案最快周六公布　政府收購價或高於市價","subheading":"","highlight":1,"hashtags":[],"create_datetime":"2026-02-20 15:00:03","schedule_ts":"2026-02-20 14:57:00","last_update_datetime":"2026-02-20 18:30:00","content":"<p>消息指，政府周六會公布宏福苑長遠安置方案，預料領導「應急住宿安排工作組」的財政司副司長黃偉綸將交代詳情。據了解，目前方案傾向由政府收購業權，收購呎價，預計會高於測量師學會估算，由原先未補地價單位平均實用呎價約6000元，增至約8000元，及已補地價單位呎價由約8000元，增至超過10000元。</p>\n\n<p>由於收購價增加，政府需要動用更多公帑補貼。當局如果按原先收購價計算，要動用近60億元。</p>\n\n<p>對於有業主要求原址重建，消息指，由於相對較小比例業主選擇這一個選項，因此政府較大機會不考慮原址重建。</p>\n\n<p><strong>測量師學會：若政府收購價高於市價&nbsp; 是恩恤補貼</strong></p>\n\n<p>測量師學會會長溫偉明接受本台訪問表示，如政府決定收購業權，災民可盡快收回款項重置居所，亦省卻追討賠償的工夫。他說，如政府最終收購價比市價高，相信是對居民的恩恤補貼，足以購買新一期居屋單位。&nbsp;</p>\n <p><strong>陳永傑：大埔1萬元呎價盤　可考慮二手居屋或高齡樓</strong></p>\n\n<p>中原地產亞太區副主席兼住宅部總裁陳永傑表示，如果單以約1萬元呎價在大埔區內買入單位，只能考慮二手居屋或資助房屋，以及和宏福苑同樣有相當樓齡的屋苑，平均呎價約1.2萬元。而且區內同一價位的供應，未必足以覆蓋所有受影響的宏福苑居民，需要考慮選擇最近的沙田區。</p>\n\n<p>陳永傑表示，目前區內二手供應約有1000至2000戶，要覆蓋宏福苑居民需要會有壓力，如果居民有能力自己再額外出資，現時大埔區內有新樓呎價約1.3萬元可以考慮，10年內樓齡的二手私樓則，最高到1.4萬元呎。</p>\n\n<p><strong>保險業聯會：如接受政府收購業權　火險賠償將交政府</strong></p>\n\n<p>保險業聯會行政總監劉佩玲指，俗稱「火險」的樓宇結構險，賠償是用作將樓宇還原至災前情況，如果宏福苑居民接受政府收購業權，相關火險的賠償會連同業權轉移給政府，後續保險的申索亦會由政府與保險公司處理。她說，家居保險與火險不同，如居民已購買家居保，不論是否售出業權，都不影響賠償，現時保險公司已處理超過8成家居保的賠償。</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":993922,"media_type":3,"title":null,"path":"/2025/12/993922/src/ace0372d-2d6e-44df-8162-d41a8bb6cc43_1766115029.jpeg","filename":"何偉豪靈車駛離宏福苑　黃子希攝.jpeg","article_media_rlt_id":490333,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"","resource":[{"resource_id":3205448,"path":"https://stream.881903.com/public/7af4701a560f3faf5f93622f99e00ab1/2025/12/e9180ec2547beb79a548e54b5554c60f.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"7af4701a560f3faf5f93622f99e00ab1","is_source":0,"media_id":993922}],"src":"https://stream.881903.com/public/7af4701a560f3faf5f93622f99e00ab1/2025/12/e9180ec2547beb79a548e54b5554c60f.jpg","srcset":"https://stream.881903.com/public/7af4701a560f3faf5f93622f99e00ab1/2025/12/e9180ec2547be
