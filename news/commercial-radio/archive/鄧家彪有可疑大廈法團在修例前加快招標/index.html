大埔的只有約500戶，認為政府不需要重建大型房屋項目，建議在宏福苑對面一幅寵物公園及球場用地重建，滿足居民需要。</p>\n\n<p><strong>鄧家彪：有大廈法團加快在修例前完成招標</strong></p>\n\n<p>政府計劃就樓宇大維修提出多項修例，包括加強市建局「招標妥」功能，對承建商及顧問公司進行背景審查，為大維修屋苑決定中標結果。鄧家彪指，政府提出修例後，有可疑大廈法團加快在修例前完成招標，認為政府要監察及嚴正處理。<br />\n&nbsp;<br />\n民建聯陳學鋒指，有安全風險的緊急工程不應再等待，但非緊急工程應延後至修訂法例後再招標。他認為，長遠要徹底解決貪腐問題，指有不法份子操控及壟斷大維修市場，市建局加強背景審查能徹底杜絕不法份子，讓合規承建商加入市場。</p>\n\n<p><strong>陳凱欣倡增免稅額　陳家佩建議生育利是累進式增加</strong></p>\n\n<p>另外，選委界陳凱欣關注公營醫療收費加價後，夜診及社區藥房等配套未跟得上，令市民感覺無選擇。她又建議下月發表的財政預算案，增加自願醫保免稅額及長者醫療券金額；又指預算案經常忽略中產，建議增加外傭免稅額。</p>\n\n<p>&nbsp;陳家珮指，明白在財政緊張下好難再派糖，建議減中產的稅項，及將鼓勵生育的2萬元利是，改為累進式增加。</p>\n\n<p>至於公務員應否繼續凍薪，陳凱欣、陳家佩、陳學鋒及鄧家彪都支持加薪。<br />\n&nbsp;</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":1000857,"media_type":3,"title":"(左起)陳學鋒、陳凱欣、陳家佩及鄧家彪出席本台節目","path":"/2026/01/1000857/src/2d69530e-821d-482e-9ddd-c7c5f84be779_1769220198.jpeg","filename":"IMG_0308.jpeg","article_media_rlt_id":486969,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"(左起)陳學鋒、陳凱欣、陳家佩及鄧家彪出席本台節目","resource":[{"resource_id":3223049,"path":"https://stream.881903.com/public/67c986994f22004cb7daa5f62a3f5eb3/2026/01/a1b2cabefadb7357d5ce73d20450a3e1.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"67c986994f22004cb7daa5f62a3f5eb3","is_source":0,"media_id":1000857}],"src":"https://stream.881903.com/public/67c986994f22004cb7daa5f62a3f5eb3/2026/01/a1b2cabefadb7357d5ce73d20450a3e1.jpg","srcset":"https://stream.881903.com/public/67c986994f22004cb7daa5f62a3f5eb3/2026/01/a1b2cabefadb7357d5ce73d20450a3e1.jpg 3x"}],"article_contents":[{"article_content_rlt_id":141707,"article_content_id":141707,"display_order":1,"
