共發出70張「消除火警危險通知書」，主要是阻塞逃生途徑和防煙門被楔開，並向阻塞逃生途徑的情況，提出37宗直接檢控。</p>\n\n<p>消防處高級消防區長黎健武指，未來會持續派便衣人員突擊巡查、加密巡查已識別的高風險樓宇和果斷執法、與物業管理業界保持溝通，並持續宣傳教育。他又說，明白市民關注部分有較高火警風險的大廈，消防正搜集市民較常前往、情況較不理想的大廈情報，承諾加強巡邏。</p>\n\n<p><strong>消防處成立4分區公眾安全隊　已巡查1300多幢樓</strong></p>\n\n<p>消防處去年3月底，成立4個「分區公眾安全隊」，包括新界南、九龍西、九龍南，及港島中。黎健武指，成立安全隊有5大目的，包括建立分區管理系統；主動巡查區內目標樓宇，及時和有效消除樓宇火警風險；透過宣傳教育，提升居民防火防災意識；在巡查中搜集數據，制定分區風險地圖；以及善用大數據，為處方制定消防安全長遠策略。</p>\n\n<p>黎健武表示，截至上月，4個分隊共巡查1300多幢目標樓宇，合共發出逾4000張「消除火警危險通知書」，並提出300多宗直接檢控。他說，處方希望陸續在其他分區成立公眾安全隊，未來亦會檢討成效，視乎資源和步伐再微調。</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"}],"parent_article_column":null,"article_media":[{"media_id":1001046,"media_type":3,"title":"","path":"/2026/01/1001046/src/beb754e1-dcc6-459b-8cef-744521e46b86_1769328722.jpeg","filename":"黎健武.jpeg","article_media_rlt_id":487075,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"黎健武（左）指消防處日後會持續派便衣人員突擊巡查　張曉欣攝","resource":[{"resource_id":3223540,"path":"https://stream.881903.com/public/f453fe7fb3359bed30f7f486642b140f/2026/01/f9523b3eba45acc538f8dbc54a7917ee.jpg","default_encode_profile_output_id":99,"is_private":0,"code":"f453fe7fb3359bed30f7f486642b140f","is_source":0,"media_id":1001046}],"src":"https://stream.881903.com/public/f453fe7fb3359bed30f7f486642b140f/2026/01/f9523b3eba45acc538f8dbc54a7917ee.jpg","srcset":"https://stream.881903.com/public/f453fe7fb3359bed30f7f486642b140f/2026/01/f9523b3eba45acc538f8dbc54a7917ee.jpg 3x"}],"article_contents":[{"article_content_rlt_id":141946,"article_content_id":141946,"display_order":1,"article_content_type":7,"article_media_rlt_id":487075,"content":null,"media_id":1001046,"media_type":3,"title":"","path":"/2026/01/100104
